# Publish `packages/frutiger-aero` to npm on a version tag.
#
# Requires an `NPM_TOKEN` repository secret (an npm automation token with publish
# rights). Without it the workflow fails at the npm step and nothing is
# published — it never publishes anything on a branch push.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed before npm is wired up should say so, not show a red X for
      # a condition the maintainer already knows about.
      - name: Check for an npm token
        id: guard
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::notice::NPM_TOKEN is not set — skipping the publish. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The built artifacts are committed, but a release must not ship a stale
      # bundle: rebuild and fail if that changes anything.
      - if: steps.guard.outputs.ready == 'true'
        name: Rebuild and verify the bundle is current
        run: |
          node packages/frutiger-aero/build.mjs
          if ! git diff --quiet -- packages/frutiger-aero/lib; then
            echo "::error::lib/ is out of date — run 'node packages/frutiger-aero/build.mjs' and commit the result"
            git --no-pager diff --stat -- packages/frutiger-aero/lib
            exit 1
          fi

      - if: steps.guard.outputs.ready == 'true'
        name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/frutiger-aero
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
