# Publish `packages/frutiger-aero` to npm on a version tag.
#
# ══ CURRENTLY INACTIVE — NOT IN USE ══════════════════════════════════════════
#
# This project is not published to npm, and the maintainer has no npm account.
# Nothing user-facing references the registry any more: installation is the
# GitHub installer (`install.sh` / `install.ps1`), which resolves the default
# branch and needs no package manager. This workflow is kept because it is
# correct and ready, not because it runs.
#
# It is safe to leave enabled. It skips itself whenever `NPM_TOKEN` is unset —
# which it is — and reports a notice rather than a failure, so a version tag
# does not produce a red X for a condition everyone already knows about. It has
# never published from a branch push and never will.
#
# To switch it on, if that ever becomes desirable:
#
#   1. Create the package on npmjs.com under the name in
#      `packages/frutiger-aero/package.json`, or rename both together —
#      the registry maps a listing to its package by name and will not
#      accept a mismatch.
#   2. Add an `NPM_TOKEN` automation token (publish rights) as a repository
#      secret via Settings → Secrets and variables → Actions.
#   3. Re-run this workflow, or push a tag.
#
# `RELEASE.md` §6 carries the same note on the manual path.
#
# Requires an `NPM_TOKEN` repository secret (an npm automation token with publish
# rights). Without it the workflow fails at the npm step and nothing is
# published — it never publishes anything on a branch push.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A tag pushed before npm is wired up should say so, not show a red X for
      # a condition the maintainer already knows about.
      - name: Check for an npm token
        id: guard
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::notice::NPM_TOKEN is not set — skipping the publish. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The built artifacts are committed, but a release must not ship a stale
      # bundle: rebuild and fail if that changes anything.
      - if: steps.guard.outputs.ready == 'true'
        name: Rebuild and verify the bundle is current
        run: |
          node packages/frutiger-aero/build.mjs
          if ! git diff --quiet -- packages/frutiger-aero/lib; then
            echo "::error::lib/ is out of date — run 'node packages/frutiger-aero/build.mjs' and commit the result"
            git --no-pager diff --stat -- packages/frutiger-aero/lib
            exit 1
          fi

      - if: steps.guard.outputs.ready == 'true'
        name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/frutiger-aero
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
